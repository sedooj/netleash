name: stale
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-stale: 30
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,roadmap
          exempt-pr-labels: pinned,security
          stale-issue-message: >
            This issue has had no activity for 30 days and will be closed in 14 days unless there is an update.
            There is no obligation to keep issues open: reopen if it is still relevant.
          stale-pr-message: >
            This pull request has had no activity for 30 days and will be closed in 14 days unless there is an update.
