name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Shell syntax
        run: |
          for f in build.sh packaging/*.sh packaging/linux/*.sh test/linux/*.sh; do bash -n "$f"; done
          sh -n get.sh
      - name: Translations of the menu bar app
        run: python3 app/check-l10n.py
      - run: go vet ./...
      - run: go test ./...
  linux-e2e:
    name: linux end-to-end (nftables in a privileged container)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bash test/linux/run.sh
  build:
    runs-on: macos-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release archive
        run: ./build.sh
      - name: Installer self-check (download, verify, extract; installs nothing)
        run: |
          NETLEASH_BASE_URL="file://$PWD/dist" NETLEASH_DRY_RUN=1 sh get.sh
