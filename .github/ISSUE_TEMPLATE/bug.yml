name: Bug report
description: Something does not work in the supported setup
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Netleash currently supports **only Claude + AmneziaVPN with its Kill Switch OFF** on macOS 26.
        Other setups are not bugs but [feature requests](../issues/new?template=feature.yml).
        **Remove personal data** (IP addresses, usernames, hostnames, local paths) before posting.
  - type: checkboxes
    id: confirm
    attributes:
      label: Checklist
      options:
        - label: I use Claude + AmneziaVPN with the Kill Switch turned OFF
          required: true
        - label: I searched existing issues
          required: true
        - label: I removed personal data from everything I paste below
          required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.2"
    validations:
      required: true
  - type: input
    id: vpn
    attributes:
      label: AmneziaVPN version and protocol
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `netleash status` and `netleash test`
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant lines of /var/log/netleash.log (redacted)
      render: text
