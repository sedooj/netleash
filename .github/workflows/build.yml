name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: for f in build.sh install.sh uninstall.sh scripts/*; do bash -n "$f"; done
      - name: Build
        run: ./build.sh
